# 3 shards horizontales + 1 nodo vertical (perfil) + la API.
# Todo con PostgreSQL 16 (gratis, open source).
x-pg: &pg
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: tienda

services:
  shard0:
    <<: *pg
    ports: ["5441:5432"]
    volumes: ["./sql/shard_init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  shard1:
    <<: *pg
    ports: ["5442:5432"]
    volumes: ["./sql/shard_init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  shard2:
    <<: *pg
    ports: ["5443:5432"]
    volumes: ["./sql/shard_init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  perfil:
    <<: *pg
    ports: ["5444:5432"]
    volumes: ["./sql/perfil_init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]

  api:
    build: .
    depends_on: [shard0, shard1, shard2, perfil]
    ports: ["8000:8000"]
    environment:
      SHARD_DSNS: >-
        postgresql://app:app@shard0:5432/tienda,
        postgresql://app:app@shard1:5432/tienda,
        postgresql://app:app@shard2:5432/tienda
      PERFIL_DSN: postgresql://app:app@perfil:5432/tienda
